<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 200" width="710" height="200" style="background:#181818; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#888888" />
    </marker>
  </defs>

  <!-- Row 1: Blocks 1 -> 2 -> 3 -->

  <!-- Block 1 -->
  <rect x="20" y="20" width="200" height="58" rx="8" fill="#303030" stroke="#555" stroke-width="1.5"/>
  <text x="120" y="43" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Agg trade tick</text>
  <text x="120" y="61" text-anchor="middle" fill="#cccccc" font-size="11.5">price, qty, side, ts</text>

  <line x1="220" y1="49" x2="235" y2="49" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Block 2 -->
  <rect x="237" y="20" width="200" height="58" rx="8" fill="#0e4738" stroke="#1d735d" stroke-width="1.5"/>
  <text x="337" y="43" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">update_footprint()</text>
  <text x="337" y="61" text-anchor="middle" fill="#a4d4c6" font-size="11.5">bid/ask volume by price</text>

  <line x1="437" y1="49" x2="452" y2="49" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Block 3 -->
  <rect x="454" y="20" width="200" height="58" rx="8" fill="#0e4738" stroke="#1d735d" stroke-width="1.5"/>
  <text x="554" y="43" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Strategy hooks</text>
  <text x="554" y="61" text-anchor="middle" fill="#a4d4c6" font-size="11.5">clusters → bar → closed</text>


  <!-- Snake Connector from Block 3 (Row 1) down to Block 4 (Row 2) -->
  <path d="M 554 78 L 554 105 L 337 105 L 337 118" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)" />


  <!-- Row 2: Blocks 5 <- 4 (snake direction: right-to-left) -->

  <!-- Block 5 (displayed on the left of row 2) -->
  <rect x="20" y="120" width="200" height="58" rx="8" fill="#144b82" stroke="#286fb8" stroke-width="1.5"/>
  <text x="120" y="143" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">Executing process</text>
  <text x="120" y="161" text-anchor="middle" fill="#bad4f2" font-size="11.5">action_for_received_signal()</text>

  <!-- Arrow pointing from Block 4 to Block 5 -->
  <line x1="235" y1="149" x2="222" y2="149" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Block 4 (displayed on the right of row 2, receiving snake flow) -->
  <rect x="237" y="120" width="200" height="58" rx="8" fill="#78351f" stroke="#aa5135" stroke-width="1.5"/>
  <text x="337" y="143" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">send_signal()</text>
  <text x="337" y="161" text-anchor="middle" fill="#e9c2b5" font-size="11.5">write to Signal ring buffer</text>

</svg>
