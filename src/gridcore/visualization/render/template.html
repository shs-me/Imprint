<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GridCore Report | {symbol}</title>
<style>
    body {{
        background-color: #121212;
        color: #ECEFF1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        margin: 0;
        padding: 16px;
    }}
    .header {{
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #263238;
        padding-bottom: 10px;
        margin-bottom: 16px;
    }}
    .header h2 {{ margin: 0; color: #00E5FF; font-size: 18px; }}
    .header span {{ color: #78909C; font-size: 12px; }}

    .tab-bar {{
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
    }}
    .tab-btn {{
        background-color: #1E1E1E;
        color: #B0BEC5;
        border: 1px solid #37474F;
        padding: 8px 16px;
        cursor: pointer;
        border-radius: 4px;
        font-weight: 600;
        font-size: 13px;
    }}
    .tab-btn.active {{
        background-color: #00E5FF;
        color: #121212;
        border-color: #00E5FF;
    }}
    .tab-content {{
        display: none;
        text-align: center;
    }}
    .tab-content.active {{
        display: block;
    }}
    img {{
        max-width: 100%;
        height: auto;
        border-radius: 6px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }}
</style>
</head>
<body>
<div class="header">
    <h2>GRIDCORE BACKTEST REPORT: {symbol}</h2>
    <span>Period: {start_date} → {end_date}</span>
</div>

<div class="tab-bar">
    <button class="tab-btn active" onclick="openTab(event, 'tab1')">📈 Dynamic Equity & DD</button>
    <button class="tab-btn" onclick="openTab(event, 'tab2')">🕯️ Price & Executions</button>
    <button class="tab-btn" onclick="openTab(event, 'tab3')">📊 KPI Dashboard</button>
    <button class="tab-btn" onclick="openTab(event, 'tab4')">📉 PnL & MAE/MFE Distribution</button>
</div>

<div id="tab1" class="tab-content active">
    <img src="data:image/png;base64,{img_equity}" alt="Equity">
</div>
<div id="tab2" class="tab-content">
    <img src="data:image/png;base64,{img_chart}" alt="Price">
</div>
<div id="tab3" class="tab-content">
    <img src="data:image/png;base64,{img_dashboard}" alt="Dashboard">
</div>
<div id="tab4" class="tab-content">
    <img src="data:image/png;base64,{img_dist}" alt="Distribution">
</div>

<script>
    function openTab(e, id) {{
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
    }}
</script>
</body>
</html>
