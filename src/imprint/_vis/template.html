<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imprint Report | {symbol}</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
    *, *::before, *::after {{
        box-sizing: border-box;
    }}
    html, body {{
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 6px 12px 8px 12px;
        background-color: #121212;
        color: #ECEFF1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }}
    .header {{
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #263238;
        padding-bottom: 4px;
        margin-bottom: 6px;
        flex-shrink: 0;
    }}
    .header-left {{
        display: flex;
        align-items: baseline;
        gap: 12px;
    }}
    .header h2 {{
        margin: 0;
        color: #00E5FF;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }}
    .header span {{
        color: #78909C;
        font-size: 11px;
        font-family: monospace;
    }}
    .fullscreen-btn {{
        background-color: #1E1E1E;
        color: #00E5FF;
        border: 1px solid #00E5FF;
        padding: 3px 10px;
        cursor: pointer;
        border-radius: 4px;
        font-weight: 600;
        font-size: 11px;
        font-family: monospace;
        transition: all 0.2s ease;
    }}
    .fullscreen-btn:hover {{
        background-color: #00E5FF;
        color: #121212;
    }}
    .tab-bar {{
        display: flex;
        gap: 8px;
        margin-bottom: 4px;
        flex-shrink: 0;
    }}
    .tab-btn {{
        background-color: #1E1E1E;
        color: #B0BEC5;
        border: 1px solid #37474F;
        padding: 4px 12px;
        cursor: pointer;
        border-radius: 4px;
        font-weight: 600;
        font-size: 11px;
        transition: all 0.2s ease;
    }}
    .tab-btn:hover {{
        background-color: #263238;
        color: #ECEFF1;
    }}
    .tab-btn.active {{
        background-color: #00E5FF;
        color: #121212;
        border-color: #00E5FF;
    }}
    .tab-content {{
        display: none;
        height: calc(100vh - 85px);
        width: 100%;
        flex: 1;
        min-height: 0;
    }}
    .tab-content.active {{
        display: block;
    }}
    .plotly-graph-div {{
        height: 100% !important;
        width: 100% !important;
    }}
</style>
</head>
<body>
<div class="header">
    <div class="header-left">
        <h2>IMPRINT BACKTEST REPORT: {symbol}</h2>
        <span>Period: {start_date} → {end_date}</span>
    </div>
    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
</div>

<div class="tab-bar">
    <button class="tab-btn active" onclick="openTab(event, 'tab1')">📊 KPI Dashboard</button>
    <button class="tab-btn" onclick="openTab(event, 'tab2')">📉 PnL & Distribution</button>
    <button class="tab-btn" onclick="openTab(event, 'tab3')">📈 Equity & Price</button>
</div>

<div id="tab1" class="tab-content active">
    {div_dashboard}
</div>
<div id="tab2" class="tab-content">
    {div_dist}
</div>
<div id="tab3" class="tab-content">
    {div_equity_and_price}
</div>

<script>
    function openTab(e, id) {{
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
        window.dispatchEvent(new Event('resize'));
    }}

    function toggleFullscreen() {{
        if (!document.fullscreenElement) {{
            document.documentElement.requestFullscreen().then(() => {{
                setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
            }}).catch(err => console.error(err));
        }} else {{
            if (document.exitFullscreen) {{
                document.exitFullscreen().then(() => {{
                    setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
                }});
            }}
        }}
    }}

    document.addEventListener('fullscreenchange', () => {{
        setTimeout(() => window.dispatchEvent(new Event('resize')), 50);
    }});

    window.addEventListener('load', function() {{
        var gd = document.querySelector('#tab3 .plotly-graph-div');
        if (!gd) return;

        if (gd._context) {{
            gd._context.doubleClick = false;
        }}

        function getActiveTraces() {{
            var candle = gd.data.find(function(tr) {{
                return tr.type === 'candlestick' && tr.visible !== false;
            }});
            var equity = gd.data.find(function(tr) {{
                return tr.name && tr.name.indexOf('Equity') === 0 && tr.visible !== false;
            }});
            return {{ candle: candle, equity: equity }};
        }}

        function calcAutozoomY(x0, x1) {{
            var trs = getActiveTraces();
            var c = trs.candle;
            var eq = trs.equity;
            if (!c || !c.x || c.x.length === 0) return {{}};

            var t0 = new Date(x0).getTime();
            var t1 = new Date(x1).getTime();

            var pLo = Infinity, pHi = -Infinity;
            var eqLo = Infinity, eqHi = -Infinity;

            for (var i = 0; i < c.x.length; i++) {{
                var ct = new Date(c.x[i]).getTime();
                if (ct >= t0 && ct <= t1) {{
                    if (c.low[i] < pLo) pLo = c.low[i];
                    if (c.high[i] > pHi) pHi = c.high[i];
                    if (eq && eq.y && eq.y[i] !== undefined) {{
                        if (eq.y[i] < eqLo) eqLo = eq.y[i];
                        if (eq.y[i] > eqHi) eqHi = eq.y[i];
                    }}
                }}
            }}

            var layoutUpdate = {{}};

            if (pLo < Infinity && pHi > -Infinity) {{
                var pPad = (pHi - pLo) * 0.04 || 1.0;
                layoutUpdate['yaxis3.range'] = [pLo - pPad, pHi + pPad];
                var baseP = c.close[0] || 1.0;
                layoutUpdate['yaxis4.range'] = [
                    (pLo - pPad - baseP) / baseP * 100.0,
                    (pHi + pPad - baseP) / baseP * 100.0
                ];
            }}

            if (eqLo < Infinity && eqHi > -Infinity) {{
                var eqPad = (eqHi - eqLo) * 0.04 || 1.0;
                layoutUpdate['yaxis.range'] = [eqLo - eqPad, eqHi + eqPad];
                var baseB = eq.y[0] || 1.0;
                layoutUpdate['yaxis2.range'] = [
                    (eqLo - eqPad - baseB) / baseB * 100.0,
                    (eqHi + eqPad - baseB) / baseB * 100.0
                ];
            }}

            return layoutUpdate;
        }}

        var updating = false;

        function toggleRange() {{
            var trs = getActiveTraces();
            var c = trs.candle;
            if (!c || !c.x || c.x.length === 0) return;

            var n = c.x.length;
            var xFullStart = c.x[0];
            var xFullEnd = c.x[n - 1];

            var curX0 = gd.layout.xaxis.range ? gd.layout.xaxis.range[0] : null;
            var curX1 = gd.layout.xaxis.range ? gd.layout.xaxis.range[1] : null;

            var isFull = (curX0 && curX1 &&
                new Date(curX0).getTime() <= new Date(xFullStart).getTime() &&
                new Date(curX1).getTime() >= new Date(xFullEnd).getTime());

            var targetX0, targetX1;

            if (isFull) {{
                var s = n > 144 ? n - 144 : 0;
                targetX0 = c.x[s];
                targetX1 = c.x[n - 1];
            }} else {{
                targetX0 = xFullStart;
                targetX1 = xFullEnd;
            }}

            var layoutUpdate = calcAutozoomY(targetX0, targetX1);
            layoutUpdate['xaxis.range'] = [targetX0, targetX1];
            layoutUpdate['xaxis2.range'] = [targetX0, targetX1];

            updating = true;
            Plotly.relayout(gd, layoutUpdate).then(function() {{
                updating = false;
            }});
        }}

        gd.on('plotly_doubleclick', function() {{
            toggleRange();
            return false;
        }});

        gd.addEventListener('dblclick', function(e) {{
            e.preventDefault();
            e.stopPropagation();
            toggleRange();
        }});

        gd.on('plotly_relayout', function(ed) {{
            if (updating) return;
            var x0 = ed['xaxis.range[0]'] || (ed['xaxis.range'] && ed['xaxis.range'][0]);
            var x1 = ed['xaxis.range[1]'] || (ed['xaxis.range'] && ed['xaxis.range'][1]);
            if (!x0 || !x1) return;

            var layoutUpdate = calcAutozoomY(x0, x1);
            if (layoutUpdate && Object.keys(layoutUpdate).length > 0) {{
                updating = true;
                Plotly.relayout(gd, layoutUpdate).then(function() {{
                    updating = false;
                }});
            }}
        }});
    }});
</script>
</body>
</html>
