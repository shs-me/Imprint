<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imprint Report | {symbol}</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
    *, *::before, *::after {{
        box-sizing: border-box;
    }}
    html, body {{
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 6px 12px 8px 12px;
        background-color: #121212;
        color: #ECEFF1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }}
    .header {{
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #263238;
        padding-bottom: 4px;
        margin-bottom: 6px;
        flex-shrink: 0;
    }}
    .header-left {{
        display: flex;
        align-items: baseline;
        gap: 12px;
    }}
    .header h2 {{
        margin: 0;
        color: #00E5FF;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }}
    .header span {{
        color: #78909C;
        font-size: 11px;
        font-family: monospace;
    }}
    .fullscreen-btn {{
        background-color: #1E1E1E;
        color: #00E5FF;
        border: 1px solid #00E5FF;
        padding: 3px 10px;
        cursor: pointer;
        border-radius: 4px;
        font-weight: 600;
        font-size: 11px;
        font-family: monospace;
        transition: all 0.2s ease;
    }}
    .fullscreen-btn:hover {{
        background-color: #00E5FF;
        color: #121212;
    }}
    .tab-bar {{
        display: flex;
        gap: 8px;
        margin-bottom: 4px;
        flex-shrink: 0;
    }}
    .tab-btn {{
        background-color: #1E1E1E;
        color: #B0BEC5;
        border: 1px solid #37474F;
        padding: 4px 12px;
        cursor: pointer;
        border-radius: 4px;
        font-weight: 600;
        font-size: 11px;
        transition: all 0.2s ease;
    }}
    .tab-btn:hover {{
        background-color: #263238;
        color: #ECEFF1;
    }}
    .tab-btn.active {{
        background-color: #00E5FF;
        color: #121212;
        border-color: #00E5FF;
    }}
    .tab-content {{
        display: none;
        height: calc(100vh - 85px);
        width: 100%;
        flex: 1;
        min-height: 0;
    }}
    .tab-content.active {{
        display: block;
    }}
    .plotly-graph-div {{
        height: 100% !important;
        width: 100% !important;
    }}
</style>
</head>
<body>
<div class="header">
    <div class="header-left">
        <h2>IMPRINT BACKTEST REPORT: {symbol}</h2>
        <span>Period: {start_date} → {end_date}</span>
    </div>
    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
</div>

<div class="tab-bar">
    <button class="tab-btn active" onclick="openTab(event, 'tab1')">📊 KPI Dashboard</button>
    <button class="tab-btn" onclick="openTab(event, 'tab2')">📉 PnL & Distribution</button>
    <button class="tab-btn" onclick="openTab(event, 'tab3')">📈 Equity & Price</button>
</div>

<div id="tab1" class="tab-content active">
    {div_dashboard}
</div>
<div id="tab2" class="tab-content">
    {div_dist}
</div>
<div id="tab3" class="tab-content">
    {div_equity_and_price}
</div>

<script>
    function openTab(e, id) {{
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
        window.dispatchEvent(new Event('resize'));
        if (id === 'tab3') {{
            var gd = document.querySelector('#tab3 .plotly-graph-div');
            if (gd && window.Plotly) {{
                Plotly.Plots.resize(gd);
            }}
        }}
    }}

    function toggleFullscreen() {{
        if (!document.fullscreenElement) {{
            document.documentElement.requestFullscreen().then(() => {{
                setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
            }}).catch(err => console.error(err));
        }} else {{
            if (document.exitFullscreen) {{
                document.exitFullscreen().then(() => {{
                    setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
                }});
            }}
        }}
    }}

    document.addEventListener('fullscreenchange', () => {{
        setTimeout(() => window.dispatchEvent(new Event('resize')), 50);
    }});

    window.addEventListener('load', function() {{
        var gd = document.querySelector('#tab3 .plotly-graph-div');
        if (!gd) return;

        function getActiveCandle() {{
            if (!gd.data) return null;
            return gd.data.find(function(tr) {{
                return tr.type === 'candlestick' && tr.visible === true;
            }}) || gd.data.find(function(tr) {{
                return tr.type === 'candlestick' && tr.visible !== false;
            }});
        }}

        function normStr(v) {{
            if (v === null || v === undefined) return '';
            if (typeof v === 'number') {{
                return new Date(v).toISOString().replace('T', ' ').slice(0, 19);
            }}
            return String(v).replace('T', ' ');
        }}

        function getLast144(c) {{
            var n = c.x.length;
            var i0 = n > 144 ? (n - 144) : 0;
            var i1 = n - 1;
            return {{ i0: i0, i1: i1, x0: c.x[i0], x1: c.x[i1] }};
        }}

        function getFull(c) {{
            var n = c.x.length;
            return {{ i0: 0, i1: n - 1, x0: c.x[0], x1: c.x[n - 1] }};
        }}

        function getVisibleIndices(c, x0, x1) {{
            var n = c.x.length;
            if (n === 0) return null;

            var s0 = normStr(x0);
            var s1 = normStr(x1);
            if (s0 > s1) {{ var tmp = s0; s0 = s1; s1 = tmp; }}

            var l = 0, r = n - 1, i0 = 0;
            while (l <= r) {{
                var m = (l + r) >> 1;
                if (normStr(c.x[m]) < s0) {{
                    l = m + 1;
                }} else {{
                    i0 = m;
                    r = m - 1;
                }}
            }}

            l = 0; r = n - 1; var i1 = n - 1;
            while (l <= r) {{
                var m = (l + r) >> 1;
                if (normStr(c.x[m]) <= s1) {{
                    i1 = m;
                    l = m + 1;
                }} else {{
                    r = m - 1;
                }}
            }}

            if (i0 > i1) {{
                i0 = Math.max(0, Math.min(i0, n - 1));
                i1 = i0;
            }}

            return {{ i0: i0, i1: i1 }};
        }}

        function getPriceRange(c, i0, i1) {{
            var minP = Infinity, maxP = -Infinity;
            for (var i = i0; i <= i1; i++) {{
                var lo = c.low[i];
                var hi = c.high[i];
                if (lo !== undefined && lo !== null && lo < minP) minP = lo;
                if (hi !== undefined && hi !== null && hi > maxP) maxP = hi;
            }}
            if (!isFinite(minP) || !isFinite(maxP)) return null;
            return {{ min: minP, max: maxP }};
        }}

        var updating = false;
        var relayoutTimer = null;
        var lastActiveName = null;

        function apply144Bars(c) {{
            if (!c || !c.x || c.x.length === 0) return;
            var target = getLast144(c);
            var pr = getPriceRange(c, target.i0, target.i1);
            if (!pr) return;

            var pad = (pr.max - pr.min) * 0.05 || (pr.min * 0.01) || 1.0;
            var yMin = pr.min - pad;
            var yMax = pr.max + pad;
            var baseP = (c.close && c.close[0]) ? c.close[0] : 1.0;

            updating = true;
            Plotly.relayout(gd, {{
                'xaxis.range': [target.x0, target.x1],
                'xaxis2.range': [target.x0, target.x1],
                'yaxis3.range': [yMin, yMax],
                'yaxis4.range': [
                    (yMin - baseP) / baseP * 100.0,
                    (yMax - baseP) / baseP * 100.0
                ]
            }}).then(function() {{
                updating = false;
            }}).catch(function() {{
                updating = false;
            }});
        }}

        function checkTimeframeChange() {{
            var c = getActiveCandle();
            if (!c) return;
            if (c.name !== lastActiveName) {{
                lastActiveName = c.name;
                apply144Bars(c);
            }}
        }}

        function autozoomPrice(x0, x1) {{
            var c = getActiveCandle();
            if (!c || !c.x || c.x.length === 0) return;

            var idxs = getVisibleIndices(c, x0, x1);
            if (!idxs) return;

            var pr = getPriceRange(c, idxs.i0, idxs.i1);
            if (!pr) return;

            var pad = (pr.max - pr.min) * 0.05 || (pr.min * 0.01) || 1.0;
            var yMin = pr.min - pad;
            var yMax = pr.max + pad;
            var baseP = (c.close && c.close[0]) ? c.close[0] : 1.0;

            updating = true;
            Plotly.relayout(gd, {{
                'yaxis3.range': [yMin, yMax],
                'yaxis4.range': [
                    (yMin - baseP) / baseP * 100.0,
                    (yMax - baseP) / baseP * 100.0
                ]
            }}).then(function() {{
                updating = false;
            }}).catch(function() {{
                updating = false;
            }});
        }}

        function handleRelayout(ed) {{
            if (updating || !ed) return;

            var c = getActiveCandle();
            if (c && c.name !== lastActiveName) {{
                lastActiveName = c.name;
                apply144Bars(c);
                return;
            }}

            if (ed['yaxis3.range'] || ed['yaxis3.range[0]'] ||
                ed['yaxis4.range'] || ed['yaxis4.range[0]'] ||
                ed['yaxis.range']  || ed['yaxis.range[0]']  ||
                ed['yaxis2.range'] || ed['yaxis2.range[0]']) {{
                return;
            }}

            var x0 = null, x1 = null;
            if (ed['xaxis2.range[0]'] !== undefined && ed['xaxis2.range[1]'] !== undefined) {{
                x0 = ed['xaxis2.range[0]'];
                x1 = ed['xaxis2.range[1]'];
            }} else if (ed['xaxis.range[0]'] !== undefined && ed['xaxis.range[1]'] !== undefined) {{
                x0 = ed['xaxis.range[0]'];
                x1 = ed['xaxis.range[1]'];
            }} else if (Array.isArray(ed['xaxis2.range'])) {{
                x0 = ed['xaxis2.range'][0];
                x1 = ed['xaxis2.range'][1];
            }} else if (Array.isArray(ed['xaxis.range'])) {{
                x0 = ed['xaxis.range'][0];
                x1 = ed['xaxis.range'][1];
            }} else if (gd._fullLayout) {{
                var ax = gd._fullLayout.xaxis2 || gd._fullLayout.xaxis;
                if (ax && ax.range) {{
                    x0 = ax.range[0];
                    x1 = ax.range[1];
                }}
            }}

            if (x0 === null || x1 === null) return;

            if (relayoutTimer) cancelAnimationFrame(relayoutTimer);
            relayoutTimer = requestAnimationFrame(function() {{
                autozoomPrice(x0, x1);
            }});
        }}

        function toggleRange() {{
            var c = getActiveCandle();
            if (!c || !c.x || c.x.length === 0) return;

            var n = c.x.length;
            var curX0 = null, curX1 = null;
            if (gd._fullLayout) {{
                var ax = gd._fullLayout.xaxis2 || gd._fullLayout.xaxis;
                if (ax && ax.range) {{
                    curX0 = ax.range[0];
                    curX1 = ax.range[1];
                }}
            }}

            var sCur0 = normStr(curX0);
            var sCur1 = normStr(curX1);
            var sFull0 = normStr(c.x[0]);
            var sFull1 = normStr(c.x[n - 1]);

            var isFull = (sCur0 && sCur1 && sCur0 <= sFull0 && sCur1 >= sFull1);

            var target = isFull ? getLast144(c) : getFull(c);
            var pr = getPriceRange(c, target.i0, target.i1);
            if (!pr) return;

            var pad = (pr.max - pr.min) * 0.05 || (pr.min * 0.01) || 1.0;
            var yMin = pr.min - pad;
            var yMax = pr.max + pad;
            var baseP = (c.close && c.close[0]) ? c.close[0] : 1.0;

            var updateObj = {{
                'xaxis.range': [target.x0, target.x1],
                'xaxis2.range': [target.x0, target.x1],
                'yaxis3.range': [yMin, yMax],
                'yaxis4.range': [
                    (yMin - baseP) / baseP * 100.0,
                    (yMax - baseP) / baseP * 100.0
                ]
            }};

            updating = true;
            Plotly.relayout(gd, updateObj).then(function() {{
                updating = false;
            }}).catch(function() {{
                updating = false;
            }});
        }}

        var initialCandle = getActiveCandle();
        if (initialCandle) {{
            lastActiveName = initialCandle.name;
            apply144Bars(initialCandle);
        }}

        gd.on('plotly_restyle', function() {{
            setTimeout(checkTimeframeChange, 30);
        }});
        gd.on('plotly_buttonclicked', function() {{
            setTimeout(checkTimeframeChange, 30);
        }});

        gd.on('plotly_doubleclick', function() {{
            toggleRange();
            return false;
        }});
        gd.addEventListener('dblclick', function(e) {{
            e.preventDefault();
            e.stopPropagation();
            toggleRange();
        }});

        gd.on('plotly_relayout', handleRelayout);
        gd.on('plotly_relayouting', handleRelayout);
    }});
</script>
</body>
</html>
