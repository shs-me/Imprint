<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imprint Report | {symbol}</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
    *, *::before, *::after {{
        box-sizing: border-box;
    }}
    html, body {{
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 6px 12px 8px 12px;
        background-color: #121212;
        color: #ECEFF1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }}
    .header {{
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #263238;
        padding-bottom: 4px;
        margin-bottom: 6px;
        flex-shrink: 0;
    }}
    .header-left {{
        display: flex;
        align-items: baseline;
        gap: 12px;
    }}
    .header h2 {{
        margin: 0;
        color: #00E5FF;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }}
    .header span {{
        color: #78909C;
        font-size: 11px;
        font-family: monospace;
    }}
    .fullscreen-btn {{
        background-color: #1E1E1E;
        color: #00E5FF;
        border: 1px solid #00E5FF;
        padding: 3px 10px;
        cursor: pointer;
        border-radius: 4px;
        font-weight: 600;
        font-size: 11px;
        font-family: monospace;
        transition: all 0.2s ease;
    }}
    .fullscreen-btn:hover {{
        background-color: #00E5FF;
        color: #121212;
    }}
    .tab-bar {{
        display: flex;
        gap: 8px;
        margin-bottom: 4px;
        flex-shrink: 0;
    }}
    .tab-btn {{
        background-color: #1E1E1E;
        color: #B0BEC5;
        border: 1px solid #37474F;
        padding: 4px 12px;
        cursor: pointer;
        border-radius: 4px;
        font-weight: 600;
        font-size: 11px;
        transition: all 0.2s ease;
    }}
    .tab-btn:hover {{
        background-color: #263238;
        color: #ECEFF1;
    }}
    .tab-btn.active {{
        background-color: #00E5FF;
        color: #121212;
        border-color: #00E5FF;
    }}
    .tab-content {{
        display: none;
        height: calc(100vh - 85px);
        width: 100%;
        flex: 1;
        min-height: 0;
    }}
    .tab-content.active {{
        display: block;
    }}
    .plotly-graph-div {{
        height: 100% !important;
        width: 100% !important;
    }}
</style>
</head>
<body>
<div class="header">
    <div class="header-left">
        <h2>IMPRINT BACKTEST REPORT: {symbol}</h2>
        <span>Period: {start_date} → {end_date}</span>
    </div>
    <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
</div>

<div class="tab-bar">
    <button class="tab-btn active" onclick="openTab(event, 'tab1')">📈 Overview (Equity & Price)</button>
    <button class="tab-btn" onclick="openTab(event, 'tab2')">📊 KPI Dashboard</button>
    <button class="tab-btn" onclick="openTab(event, 'tab3')">📉 PnL & Distribution</button>
</div>

<div id="tab1" class="tab-content active">
    {div_overview}
</div>
<div id="tab2" class="tab-content">
    {div_dashboard}
</div>
<div id="tab3" class="tab-content">
    {div_dist}
</div>

<script>
    function openTab(e, id) {{
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        e.currentTarget.classList.add('active');
        window.dispatchEvent(new Event('resize'));
    }}

    function toggleFullscreen() {{
        if (!document.fullscreenElement) {{
            document.documentElement.requestFullscreen().then(() => {{
                setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
            }}).catch(err => console.error(err));
        }} else {{
            if (document.exitFullscreen) {{
                document.exitFullscreen().then(() => {{
                    setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
                }});
            }}
        }}
    }}

    document.addEventListener('fullscreenchange', () => {{
        setTimeout(() => window.dispatchEvent(new Event('resize')), 50);
    }});
</script>
</body>
</html>
