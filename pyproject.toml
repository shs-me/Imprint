[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imprint"
version = "0.1.0"
description = "Imprint"
readme = "README.md"
requires-python = "==3.13.12"
authors = [
    { name = "Sherali Safaralizoda", email = "imprint+shs06main@gmail.com" }
]
keywords = ["trading", "backtesting", "finance", "quant"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy==2.4.6",
    "numba==0.66.0",
    "msgspec==0.21.1",
    "websockets==16.1.1",
    "loguru==0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
]

plot = [
    "matplotlib==3.11.1",
]

all = [
    "imprint[dev,plot]",
]

[project.urls]
Homepage = "https://github.com/shs-me/Imprint"
Repository = "https://github.com/shs-me/Imprint.git"

[tool.hatch.build.targets.wheel]
packages = ["src/imprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 80

[tool.pyright]
reportAny = false
reportExplicitAny = false
reportPrivateUsage = false
reportUnusedCallResult = false
