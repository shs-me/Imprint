[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imprint"
version = "0.1.0"
description = "Multiprocess order-flow trading engine for crypto futures backtesting and live execution"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Sherali Safaralizoda", email = "shs06main@gmail.com" }
]
keywords = [
    "trading-engine",
    "footprint-chart",
    "order-flow",
    "backtesting",
    "crypto-trading",
    "algorithmic-trading",
    "market-microstructure",
    "quantitative-finance",
    "shared-memory",
    "ipc",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
]

dependencies = [
    "numpy==2.4",
    "numba==0.66",
    "msgspec==0.21",
    "websockets==16.1",
    "httpx==0.28",
    "loguru==0.7",
    "python-dotenv==1.2"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1",
    "pytest-cov==7.1",
    "ruff==0.16",
    "basedpyright==1.40",
]

plot = [
    "plotly==7.0",
    "streamlit==1.65"
]

all = [
    "imprint[dev,plot]",
]

[project.urls]
Homepage = "https://github.com/shs-me/Imprint"
Repository = "https://github.com/shs-me/Imprint.git"

[tool.hatch.build.targets.wheel]
packages = ["src/imprint"]

[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/integration"
]
pythonpath = ["src"]
addopts = "--cov=imprint --cov-report=term-missing"

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = [
     "BLE001"
]

[tool.basedpyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

exclude = [
    "**/.*",
    "**/__pycache__",
    "build",
    "dist",
]

typeCheckingMode = "strict"
reportAny = false
reportExplicitAny = false
reportPrivateUsage = false
reportUnusedCallResult = false
